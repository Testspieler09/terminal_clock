clock_type = "ColorClock"

[config]
name = "Thermometer"

hour = """   ╭─╮ °C
12 ┤█│
   ┤█│
 9 ┤█│
   ┤█│
   ┤█│
 7 ┤█│
   ┤█│
   ┤█│
 4 ┤█│
   ┤█│
   ┤█│
 1 ┤█│
   ╰─╯"""
minutes = """   ╭─╮ °F
60 ┤█│
   ┤█│
45 ┤█│
   ┤█│
   ┤█│
35 ┤█│
   ┤█│
   ┤█│
20 ┤█│
   ┤█│
   ┤█│
 5 ┤█│
   ╰─╯"""
seconds = """   ╭─╮ °F
60 ┤█│
   ┤█│
45 ┤█│
   ┤█│
   ┤█│
35 ┤█│
   ┤█│
   ┤█│
20 ┤█│
   ┤█│
   ┤█│
 5 ┤█│
   ╰─╯"""

render_mode = "gauge"

[config.behavior.gauge]
max_hour = 12
direction = "bottom_to_top"

# hour_coords: one LedMap entry per step.
# step_index = minimum value needed to light this row.
# Rows fill bottom-up: step 0 = row 12 (bottom), step 11 = row 1 (top).
# col 3 is the █ cell in the ASCII art.
hour_coords = [
  [
    [0,  [[12, 3]]],
    [1,  [[11, 3]]],
    [2,  [[10, 3]]],
    [3,  [[9,  3]]],
    [4,  [[8,  3]]],
    [5,  [[7,  3]]],
    [6,  [[6,  3]]],
    [7,  [[5,  3]]],
    [8,  [[4,  3]]],
    [9,  [[3,  3]]],
    [10, [[2,  3]]],
    [11, [[1,  3]]],
  ],
  []
]

# minute_coords: step_index = value threshold (every 5 values, 12 steps for 60).
minute_coords = [
  [
    [0,  [[12, 3]]],
    [5,  [[11, 3]]],
    [10, [[10, 3]]],
    [15, [[9,  3]]],
    [20, [[8,  3]]],
    [25, [[7,  3]]],
    [30, [[6,  3]]],
    [35, [[5,  3]]],
    [40, [[4,  3]]],
    [45, [[3,  3]]],
    [50, [[2,  3]]],
    [55, [[1,  3]]],
  ],
  []
]

second_coords = [
  [
    [0,  [[12, 3]]],
    [5,  [[11, 3]]],
    [10, [[10, 3]]],
    [15, [[9,  3]]],
    [20, [[8,  3]]],
    [25, [[7,  3]]],
    [30, [[6,  3]]],
    [35, [[5,  3]]],
    [40, [[4,  3]]],
    [45, [[3,  3]]],
    [50, [[2,  3]]],
    [55, [[1,  3]]],
  ],
  []
]

always_on_coords = []

format = "HH:MM:SS"

