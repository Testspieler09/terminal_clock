name: Release Pipeline

on:
  push:
    branches: [ "main" ]
    paths:
      - "Cargo.toml"
  workflow_dispatch:
    inputs:
      version:
        description: "Version to rebuild Docker image for (e.g. 1.2.3)"
        required: false

permissions:
  contents: write
  packages: write

jobs:
  detect:
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.vars.outputs.changed }}
      version: ${{ steps.vars.outputs.current }}

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Extract Versions (root only)
        id: vars
        run: |
          CUR=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -n 1)
          PREV=$(git show HEAD~1:Cargo.toml | sed -n 's/^version = "\(.*\)"/\1/p' | head -n 1 || echo "")

          echo "current=$CUR" >> $GITHUB_OUTPUT

          if [ "$CUR" != "$PREV" ] && [[ "$CUR" != *-* ]]; then
            echo "changed=true" >> $GITHUB_OUTPUT
            echo "Release detected: $CUR"
          else
            echo "changed=false" >> $GITHUB_OUTPUT
            echo "Skipping"
          fi

  tag:
    needs: detect
    if: needs.detect.outputs.changed == 'true'
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.tag.outputs.tag }}

    steps:
      - uses: actions/checkout@v7

      - name: Create Tag
        id: tag
        run: |
          TAG="v${{ needs.detect.outputs.version }}"
          echo "tag=$TAG" >> $GITHUB_OUTPUT

          if git rev-parse "$TAG" >/dev/null 2>&1; then
            echo "Tag exists, skipping"
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git tag -a "$TAG" -m "Release $TAG"
          git push origin "$TAG"

  build-release:
    needs: tag
    runs-on: ${{ matrix.os }}

    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            asset_name: terminal_clock-linux-x86_64.tar.gz
          - os: windows-latest
            asset_name: terminal_clock-windows-x86_64.zip
          - os: macos-latest
            asset_name: terminal_clock-macos-x86_64.tar.gz

    steps:
      - uses: actions/checkout@v7

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Build
        run: cargo build --release --locked

      - name: Package (Unix)
        if: runner.os != 'Windows'
        run: |
          cd target/release
          tar czf ../../${{ matrix.asset_name }} tc check-config

      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          cd target/release
          Compress-Archive -Path tc.exe, check-config.exe -DestinationPath ..\..\${{ matrix.asset_name }}

      - name: Upload Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.tag.outputs.tag }}
          files: ${{ matrix.asset_name }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  docker:
    needs: [detect, tag]
    if: |
      needs.detect.outputs.changed == 'true' ||
      github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    continue-on-error: true

    steps:
      - uses: actions/checkout@v7

      - name: Set version
        id: ver
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            VERSION="${{ github.event.inputs.version }}"
          else
            VERSION="${{ needs.detect.outputs.version }}"
          fi
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & Push
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ghcr.io/${{ github.repository }}:latest
            ghcr.io/${{ github.repository }}:${{ steps.ver.outputs.version }}

  summary:
    needs: [detect, tag, build-release, docker]
    if: always()
    runs-on: ubuntu-latest

    steps:
      - name: Write summary
        run: |
          VERSION="${{ needs.detect.outputs.version }}"
          TAG="v$VERSION"
          CHANGED="${{ needs.detect.outputs.changed }}"
          BUILD_RESULT="${{ needs.build-release.result }}"
          DOCKER_RESULT="${{ needs.docker.result }}"

          echo "## Release Pipeline Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          if [ "$CHANGED" != "true" ] && [ "${{ github.event_name }}" != "workflow_dispatch" ]; then
            echo "No version bump detected - nothing was released." >> $GITHUB_STEP_SUMMARY
            exit 0
          fi

          echo "**Version:** \`$TAG\`" >> $GITHUB_STEP_SUMMARY
          echo "**Triggered by:** \`${{ github.event_name }}\`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          echo "### Artifacts" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          if [ "$BUILD_RESULT" = "success" ]; then
            echo "| Platform | Archive | Binaries |" >> $GITHUB_STEP_SUMMARY
            echo "|----------|---------|----------|" >> $GITHUB_STEP_SUMMARY
            echo "| Linux    | \`terminal_clock-linux-x86_64.tar.gz\`   | \`tc\`, \`check-config\` |" >> $GITHUB_STEP_SUMMARY
            echo "| macOS    | \`terminal_clock-macos-x86_64.tar.gz\`   | \`tc\`, \`check-config\` |" >> $GITHUB_STEP_SUMMARY
            echo "| Windows  | \`terminal_clock-windows-x86_64.zip\`    | \`tc.exe\`, \`check-config.exe\` |" >> $GITHUB_STEP_SUMMARY
          else
            echo ":x: Binary builds **$BUILD_RESULT** - no release artifacts uploaded." >> $GITHUB_STEP_SUMMARY
          fi

          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Docker" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          if [ "$DOCKER_RESULT" = "success" ]; then
            echo "| Tag | Image |" >> $GITHUB_STEP_SUMMARY
            echo "|-----|-------|" >> $GITHUB_STEP_SUMMARY
            echo "| \`latest\`      | \`ghcr.io/${{ github.repository }}:latest\` |" >> $GITHUB_STEP_SUMMARY
            echo "| \`$VERSION\` | \`ghcr.io/${{ github.repository }}:$VERSION\` |" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "Includes: \`tc\`, \`check-config\` (entrypoint: \`tc\`)" >> $GITHUB_STEP_SUMMARY
          else
            echo ":x: Docker build **$DOCKER_RESULT**." >> $GITHUB_STEP_SUMMARY
          fi
